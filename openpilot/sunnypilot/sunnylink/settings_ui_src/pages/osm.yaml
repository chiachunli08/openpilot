# Page: OSM and navigation
id: osm
label: OSM & Navigation
icon: map
order: 8
remote_configurable: true
description: Offline maps and Mapbox route guidance
sections:
- id: navigation
  title: Navigation
  description: Mapbox routing requires Wi-Fi or cellular data to load or recalculate a route. An already loaded route remains available through a temporary connection loss.
  items:
  - key: NavigationEnabled
    widget: toggle
    title: Enable Navigation
    description: Load routes and show the next maneuver on the driving screen.
  - key: NavigationTurnPromptEnabled
    widget: toggle
    title: Turn-by-turn Instructions
    description: Show maneuver direction, road text, remaining distance, and estimated arrival time on the driving screen.
    enablement:
    - type: param
      key: NavigationEnabled
      equals: true
  - key: MapboxMapDisplayEnabled
    widget: toggle
    title: C3X Mapbox Driving Map
    description: Show Mapbox tiles, the active route, and vehicle position. This display panel supports only comma 3X (tizi).
    enablement:
    - type: param
      key: NavigationEnabled
      equals: true
    - type: capability
      field: device_type
      equals: tizi
  - key: NavigationIntentEnabled
    widget: toggle
    title: Navigation Intent for Driving Model
    description: Convert approaching left and right maneuvers into existing model turn desires. This does not control the vehicle turn signals.
    enablement:
    - type: param
      key: NavigationEnabled
      equals: true
  - key: NavigationModelEnabled
    widget: toggle
    title: taco2 Navigation Model (Shadow)
    description: Download, precompile while parked, and run the pinned taco2 navigation model. Its output stays diagnostic unless the driving model has a verified navigation input.
    enablement:
    - type: param
      key: NavigationEnabled
      equals: true
    - type: any
      conditions:
      - type: capability
        field: device_type
        equals: tici
      - type: capability
        field: device_type
        equals: tizi
    - type: offroad_only
  - key: NavigationModelFusionEnabled
    widget: toggle
    title: Navigation Features for Driving Model
    description: Enable only for a selected model with a verified 64-value navigation feature input. Incompatible models remain isolated in shadow mode.
    enablement:
    - type: param
      key: NavigationModelEnabled
      equals: true
    - type: param
      key: NavigationModelFusionCompatible
      equals: true
    - type: offroad_only
  - key: NavigationModelInstallStatus
    widget: info
    title: Navigation Model Preparation
    description: Shows download and offroad precompile state. Onroad startup never compiles this model.
