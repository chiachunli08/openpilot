name: Sync star-dom with upstream Dom

on:
  schedule:
    # UTC 00:37, 06:37, 12:37, 18:37 (Taipei 08:37, 14:37, 20:37, 02:37).
    - cron: '37 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-star-dom
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'chiachunli08/openpilot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out star-dom with full history
        uses: actions/checkout@v4
        with:
          ref: star-dom
          fetch-depth: 0
          submodules: false
          lfs: false

      - name: Merge upstream Dom and preserve existing commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/firestar5683/StarPilot.git
          git fetch --no-tags upstream refs/heads/Dom:refs/remotes/upstream/Dom

          old_head="$(git rev-parse HEAD)"
          upstream_head="$(git rev-parse refs/remotes/upstream/Dom)"
          {
            echo '## star-dom sync'
            echo "Previous star-dom: $old_head"
            echo "Upstream Dom: $upstream_head"
          } >> "$GITHUB_STEP_SUMMARY"

          if git merge-base --is-ancestor "$upstream_head" HEAD; then
            echo 'Already up to date. All local commits preserved.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! git merge --no-edit "$upstream_head"; then
            {
              echo 'Merge failed. Remote star-dom was not modified; manual resolution is required.'
              echo 'Conflicted paths:'
              git diff --name-only --diff-filter=U
            } >> "$GITHUB_STEP_SUMMARY"
            git merge --abort || true
            echo '::error::Upstream merge failed. Resolve manually; no commits were overwritten.'
            exit 1
          fi

          # Both histories must remain reachable before publishing.
          git merge-base --is-ancestor "$old_head" HEAD
          git merge-base --is-ancestor "$upstream_head" HEAD

          # A concurrent push causes a safe rejection; never force-push.
          git push origin HEAD:refs/heads/star-dom
          echo "Synced successfully: $(git rev-parse HEAD). Existing commit SHAs preserved." >> "$GITHUB_STEP_SUMMARY"
