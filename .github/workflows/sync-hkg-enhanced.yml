name: Sync tony-sp with TonyBinheWu/sunnypilot@hkg-enhanced

on:
  schedule:
    # 06:00 UTC and 18:00 UTC every day (Taiwan 14:00 / 02:00)
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-tony-sp-hkg-enhanced
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'chiachunli08/openpilot'
    name: Merge upstream hkg-enhanced into tony-sp
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tony-sp with full history
        uses: actions/checkout@v6
        with:
          ref: tony-sp
          fetch-depth: 0
          submodules: false
          lfs: false

      - name: Merge upstream hkg-enhanced and preserve existing commits
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/TonyBinheWu/sunnypilot.git
          git fetch --no-tags upstream refs/heads/hkg-enhanced:refs/remotes/upstream/hkg-enhanced

          old_head="$(git rev-parse HEAD)"
          upstream_head="$(git rev-parse refs/remotes/upstream/hkg-enhanced)"
          {
            echo "## tony-sp sync"
            echo "Previous tony-sp: $old_head"
            echo "Upstream hkg-enhanced: $upstream_head"
          } >> "$GITHUB_STEP_SUMMARY"

          if git merge-base --is-ancestor "$upstream_head" HEAD; then
            echo "Already up to date. All tony-sp commits were preserved." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if ! git merge --no-edit "$upstream_head"; then
            {
              echo "Merge failed. Remote tony-sp was not modified; manual resolution is required."
              echo "Conflicted paths:"
              git diff --name-only --diff-filter=U
            } >> "$GITHUB_STEP_SUMMARY"
            git merge --abort || true
            echo "::error::Upstream merge failed. Resolve manually; no commits were overwritten."
            exit 1
          fi

          # Verify that neither side was lost before publishing the merge.
          git merge-base --is-ancestor "$old_head" HEAD
          git merge-base --is-ancestor "$upstream_head" HEAD

          # A concurrent push is rejected safely; never rewrite tony-sp history.
          git push origin HEAD:refs/heads/tony-sp
          echo "Synced successfully: $(git rev-parse HEAD). Existing commit SHAs were preserved." >> "$GITHUB_STEP_SUMMARY"
